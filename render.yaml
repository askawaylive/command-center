# Render Blueprint: one web service + one Postgres database.
# Add API keys (ANTHROPIC_API_KEY, MERCURY_API_TOKEN, STRIPE_*, SHOPIFY_*, GOOGLE_*) in the
# service's Environment tab on Render; see .env.example for the full list.
services:
  - type: web
    name: command-center
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: command-center-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Login password. Reveal it in Render > command-center > Environment, or change it there.
      - key: APP_PASSWORD
        generateValue: true
      - key: OWNER_NAME
        value: Scott

databases:
  - name: command-center-db
    plan: free
    region: virginia
    postgresMajorVersion: "16"
