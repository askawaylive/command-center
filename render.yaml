# Render Blueprint: one web service + one Postgres database.
services:
  - type: web
    name: command-center
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: command-center-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      - key: OWNER_NAME
        value: Scott
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MERCURY_API_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

databases:
  - name: command-center-db
    plan: basic-256mb
