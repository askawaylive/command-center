# Render's free plan puts the app to sleep after 15 idle minutes, and waking it takes
# up to a minute. This pings it every 10 minutes from 6am to midnight New York time so
# it's already awake when you open it. Overnight it may sleep to stay within free hours.
name: Keep app awake
on:
  schedule:
    - cron: "*/10 0-4,11-23 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 https://command-center-4ybh.onrender.com/api/health || true
